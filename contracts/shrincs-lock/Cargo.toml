[package]
name = "shrincs-lock"
version = "0.1.0"
edition = "2024"

[dependencies]
ckb-std = "1.1"
ckb-hash = { version = "1.1", default-features = false, features = ["ckb-contract"] }
shrincs = { package = "shrincs-rs", version = "1.0.0", default-features = false }

[features]
library = []
native-simulator = ["library", "ckb-std/native-simulator"]
